name: Supabase Keepalive

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate secrets presence
        run: |
          echo "KEEPALIVE_SUPABASE_URL set: ${{ secrets.KEEPALIVE_SUPABASE_URL != '' }}"
          echo "KEEPALIVE_SUPABASE_SERVICE_ROLE_KEY set: ${{ secrets.KEEPALIVE_SUPABASE_SERVICE_ROLE_KEY != '' }}"
      - name: Ping Supabase
        run: node scripts/supabase-keepalive.mjs
        env:
          KEEPALIVE_SUPABASE_URL: ${{ secrets.KEEPALIVE_SUPABASE_URL }}
          KEEPALIVE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.KEEPALIVE_SUPABASE_SERVICE_ROLE_KEY }}
